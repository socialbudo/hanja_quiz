    // 자동 초성(ㄱ, ㄴ, ㄷ...) 할당
    const IDIOM_DATA = IDIOM_DATA_RAW.map(item => ({

    const SPLIT_MEAN_DATA = [...rawSplitList].sort(() => Math.random() - 0.5);

    function App() {
      const [tab, setTab] = useState('exam');

    // 모의고사 모듈
    function ExamModule({ data, splitData, toggleReview, reviewIds }) {
      const [examStatus, setExamStatus] = useState('config'); 
      const [datasetMode, setDatasetMode] = useState('split');
      const [chosungFilter, setChosungFilter] = useState('전체');
      const [questionCount, setQuestionCount] = useState(10);
      const [quizList, setQuizList] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState([]);
      const [userAnswer, setUserAnswer] = useState('');
      const [currentIsCorrect, setCurrentIsCorrect] = useState(null);
      const [showHintChosung, setShowHintChosung] = useState(false);
      const [showHintHanja, setShowHintHanja] = useState(false);
      const [elapsedTime, setElapsedTime] = useState(0);
      const timerRef = useRef(null);
      const feedbackBoxRef = useRef(null);

      const baseChosungList = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

      const targetPool = useMemo(() => {
        let pool = datasetMode === 'split' ? splitData : data.map(item => {
          const hasMean2 = Boolean(item.mean2 && item.mean2.trim() !== '' && item.mean2 !== '-');
          const promptType = hasMean2 ? (Math.random() < 0.5 ? 'mean1' : 'mean2') : 'mean1';
          return {
            ...item,
            meanLabel: promptType === 'mean1' ? '뜻 1' : '뜻 2',
            promptMean: promptType === 'mean1' ? item.mean1 : item.mean2
          };
        });

        if (chosungFilter !== '전체') {
          pool = pool.filter(item => item.chosung === chosungFilter);
        }
        return pool;
      }, [datasetMode, chosungFilter, data, splitData]);

      const chosungCounts = useMemo(() => {
        const counts = {};
        const activePool = datasetMode === 'split' ? splitData : data;
        activePool.forEach(item => {
          counts[item.chosung] = (counts[item.chosung] || 0) + 1;
        });
        return counts;
      }, [datasetMode, data, splitData]);

      const startExam = (count) => {
        if (targetPool.length === 0) {
          alert('해당 초성에 해당하는 문제가 없습니다.');
          return;
        }
        const shuffled = [...targetPool].sort(() => Math.random() - 0.5);
        const selected = count === 999 ? shuffled : shuffled.slice(0, count);
        
        setQuizList(selected);
        setUserAnswers(new Array(selected.length).fill(''));
        setCurrentIndex(0);
        setUserAnswer('');
        setCurrentIsCorrect(null);
        setShowHintChosung(false);
        setShowHintHanja(false);
        setElapsedTime(0);
        setExamStatus('answering');

        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => setElapsedTime(prev => prev + 1), 1000);
      };

      const handleProcessAnswer = () => {
        if (!userAnswer.trim()) return;

        const currentQ = quizList[currentIndex];
        const ans = userAnswer.replace(/\s+/g, '');
        const target = currentQ.idiom_kr.replace(/\s+/g, '');
        const isCorrect = ans === target;

        const updated = [...userAnswers];
        updated[currentIndex] = userAnswer;
        setUserAnswers(updated);
        setCurrentIsCorrect(isCorrect);
        setExamStatus('feedback');
      };

      const handleNextQuestion = () => {
        setUserAnswer('');
        setCurrentIsCorrect(null);
        setShowHintChosung(false);
        setShowHintHanja(false);

        if (currentIndex + 1 < quizList.length) {
          setCurrentIndex(currentIndex + 1);
          setExamStatus('answering');
        } else {
          finishExam();
        }
      };

      const finishExam = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        setExamStatus('result');
      };

      // 피드백 상태가 되었을 때 포커스를 주어 엔터키 입력을 바로 받도록 처리
      useEffect(() => {
        if (examStatus === 'feedback' && feedbackBoxRef.current) {
          feedbackBoxRef.current.focus();
        }
      }, [examStatus]);

      // 엔터키 핸들러 (입력 상태일 때 제출, 피드백 상태일 때 다음 문제로)
      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (examStatus === 'answering') {
            handleProcessAnswer();
          } else if (examStatus === 'feedback') {
            handleNextQuestion();
          }
        }
      };

      const scoreResult = useMemo(() => {
        if (examStatus !== 'result') return { correctCount: 0, percentage: 0, details: [] };
        let correct = 0;
        const details = quizList.map((item, idx) => {
          const ans = (userAnswers[idx] || '').replace(/\s+/g, '');
          const target = item.idiom_kr.replace(/\s+/g, '');
          const isCorrect = ans === target;
          if (isCorrect) correct++;
          return { ...item, userAns: userAnswers[idx] || '(미응답)', isCorrect };
        });
        return { correctCount: correct, percentage: Math.round((correct / quizList.length) * 100), details };
      }, [examStatus, quizList, userAnswers]);

      const addAllWrongToReview = () => {
        scoreResult.details.forEach(item => {
          if (!item.isCorrect && !reviewIds.includes(item.id)) {
            toggleReview(item.id);
          }
        });
        alert('틀린 문항이 오답노트에 추가되었습니다!');
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins > 0 ? `${mins}분 ` : ''}${secs}초`;
      };

      if (examStatus === 'config') {
        const maxAllCount = targetPool.length;

        return (
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 className="text-xl font-bold text-slate-900 mb-2">실전 모의고사 설정</h2>
            <p className="text-sm text-slate-500 mb-6">출제 방식과 초성, 문항 수를 선택하세요. (엔터키로 채점 및 다음 진행 가능)</p>

            <div className="mb-6">
              <label className="block font-bold text-xs text-slate-500 uppercase tracking-wider mb-2">출제 방식 선택</label>
              <div className="grid grid-cols-2 gap-3">
                <button
                  onClick={() => setDatasetMode('normal')}
                  className={`p-4 rounded-xl border-2 text-left transition-all ${datasetMode === 'normal' ? 'border-indigo-600 bg-indigo-50/60 text-indigo-900 shadow-sm' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}
                >
                  <div className="font-extrabold text-sm mb-1">📌 100개 성어 모드</div>
                  <div className="text-xs text-slate-500">100개 사자성어 중 뜻 1 또는 뜻 2 무작위 출제</div>
                </button>

                <button
                  onClick={() => setDatasetMode('split')}
                  className={`p-4 rounded-xl border-2 text-left transition-all ${datasetMode === 'split' ? 'border-indigo-600 bg-indigo-50/60 text-indigo-900 shadow-sm' : 'border-slate-200 hover:bg-slate-50 text-slate-600'}`}
                >
                  <div className="font-extrabold text-sm mb-1">🔥 전체 뜻 분리 모드 ({splitData.length}개)</div>
                  <div className="text-xs text-slate-500">뜻 1과 뜻 2를 개별 카드로 완전 분리하여 셔플 출제</div>
                </button>
              </div>
            </div>

            {/* 초성 선택 필터 */}
            <div className="mb-6">
              <label className="block font-bold text-xs text-slate-500 uppercase tracking-wider mb-2">초성별 범위 선택</label>
              <div className="flex flex-wrap gap-1.5">
                <button
                  onClick={() => setChosungFilter('전체')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${chosungFilter === '전체' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  전체 ({datasetMode === 'split' ? splitData.length : 100})
                </button>
                {baseChosungList.map(c => {
                  const cnt = chosungCounts[c] || 0;
                  if (cnt === 0) return null;
                  return (
                    <button
                      key={c}
                      onClick={() => setChosungFilter(c)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${chosungFilter === c ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                    >
                      {c}({cnt})
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mb-8">
              <label className="block font-bold text-xs text-slate-500 uppercase tracking-wider mb-3">응시할 문항 수 (선택 초성 최대: {maxAllCount}문항)</label>
              <div className="grid grid-cols-4 gap-3">
                {[10, 20, 50, 999].map(count => (
                  <button
                    key={count}
                    onClick={() => setQuestionCount(count)}
                    className={`py-3.5 px-4 rounded-xl border-2 text-sm font-extrabold transition-all ${questionCount === count ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    {count === 999 ? `전체 (${maxAllCount}문항)` : `${count}문항`}
                  </button>
                ))}
              </div>
            </div>

            <button onClick={() => startExam(questionCount)} className="w-full py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-100 transition-all text-lg flex items-center justify-center gap-2">
              ⚡ 모의고사 시작하기 ({questionCount === 999 ? maxAllCount : Math.min(questionCount, maxAllCount)}문항)
            </button>
          </div>
        );
      }

      if (examStatus === 'answering' || examStatus === 'feedback') {
        const currentQ = quizList[currentIndex];
        return (
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <div className="flex justify-between items-center mb-4 text-xs font-bold text-slate-400">
              <span>문제 {currentIndex + 1} / {quizList.length}</span>
              <span className="text-indigo-600">⏱️ {formatTime(elapsedTime)}</span>
              <button onClick={finishExam} className="text-rose-500 hover:underline">시험 종료</button>
            </div>

            <div className="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
              <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${((currentIndex + 1) / quizList.length) * 100}%` }}></div>
            </div>

            {/* 뜻1인지 뜻2인지 명확하게 표기되도록 수정 */}
            <div className="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-6 mb-6 text-center">
              <span className="inline-block bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full mb-3 shadow-sm">
                {currentQ.meanLabel ? `[ ${currentQ.meanLabel} ]` : '[ 뜻 출제 ]'}
              </span>
              <h3 className="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                "{currentQ.promptMean}"
              </h3>
            </div>

            <div className="flex justify-center gap-3 mb-6">
              <button type="button" onClick={() => setShowHintChosung(!showHintChosung)} className={`text-xs px-3 py-1.5 rounded-lg border font-bold transition-colors ${showHintChosung ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                💡 초성 힌트 {showHintChosung ? `: ${currentQ.chosung}` : ''}
              </button>
              <button type="button" onClick={() => setShowHintHanja(!showHintHanja)} className={`text-xs px-3 py-1.5 rounded-lg border font-bold transition-colors ${showHintHanja ? 'bg-indigo-100 border-indigo-300 text-indigo-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                漢 한자 힌트 {showHintHanja ? `: ${currentQ.idiom_cn}` : ''}
              </button>
            </div>

            {examStatus === 'answering' ? (
              <div>
                <input
                  type="text"
                  autoFocus
                  placeholder="한글 4글자 답안 입력 후 엔터"
                  value={userAnswer}
                  onChange={e => setUserAnswer(e.target.value)}
                  onKeyDown={handleKeyDown}
                  className="w-full text-center text-2xl font-black p-4 rounded-2xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none mb-4 tracking-wider"
                />
                <button type="button" onClick={handleProcessAnswer} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">
                  정답 제출하기 (Enter)
                </button>
              </div>
            ) : (
              <div ref={feedbackBoxRef} tabIndex={0} onKeyDown={handleKeyDown} className="text-center py-2 outline-none cursor-pointer">
                <div className={`text-3xl sm:text-4xl font-black mb-3 ${currentIsCorrect ? 'text-emerald-500' : 'text-rose-500'}`}>
                  {currentIsCorrect ? '⭕ 정답입니다!' : '❌ 틀렸습니다!'}
                </div>

                {!currentIsCorrect && (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-3 mb-4 text-left max-w-sm mx-auto">
                    <p className="text-xs text-rose-600 font-bold mb-0.5">내가 쓴 답: {userAnswer}</p>
                    <p className="text-sm font-black text-slate-900">정답: {currentQ.idiom_kr} ({currentQ.idiom_cn})</p>
                  </div>
                )}

                <button type="button" onClick={handleNextQuestion} className="w-full max-w-sm mx-auto py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">
                  {currentIndex + 1 === quizList.length ? '결과 보기 (Enter) ➔' : '다음 문제로 (Enter) ➔'}
                </button>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <div className="text-center pb-6 border-b border-slate-100 mb-6">
            <h2 className="text-2xl font-black text-slate-900 mb-2">모의고사 최종 결과</h2>
            <div className="text-5xl font-black text-indigo-600 mb-3">{scoreResult.percentage}점</div>
            <p className="text-sm font-bold text-slate-600">
              총 {quizList.length}문항 중 <span className="text-emerald-600">{scoreResult.correctCount}개</span> 정답
            </p>
            <p className="text-xs text-slate-400 mt-1">소요 시간: {formatTime(elapsedTime)}</p>

            <div className="flex justify-center gap-3 mt-6">
              <button onClick={() => setExamStatus('config')} className="px-5 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-colors">
                🔄 다시 시험 보기
              </button>
              <button onClick={addAllWrongToReview} className="px-5 py-2.5 bg-rose-50 border border-rose-200 text-rose-600 text-sm font-bold rounded-xl hover:bg-rose-100 transition-colors">
                ❌ 틀린 문제 오답노트에 담기
              </button>
            </div>
          </div>

          <h3 className="font-bold text-slate-900 mb-4">문항별 상세 내역</h3>
          <div className="space-y-3">
            {scoreResult.details.map((item, idx) => (
              <div key={idx} className={`p-4 rounded-xl border ${item.isCorrect ? 'border-emerald-200 bg-emerald-50/40' : 'border-rose-200 bg-rose-50/40'}`}>
                <div className="flex justify-between items-start mb-1">
                  <div className="flex items-center gap-2">
                    <span className={`font-black text-sm ${item.isCorrect ? 'text-emerald-600' : 'text-rose-600'}`}>
                      #{idx + 1} {item.isCorrect ? '⭕ 정답' : '❌ 오답'}
                    </span>
                    <span className="font-bold text-slate-900">{item.idiom_kr}</span>
                    <span className="text-xs text-slate-500">({item.idiom_cn})</span>
                  </div>
                  <button onClick={() => toggleReview(item.id)} className={`text-xs px-2 py-1 rounded border font-bold ${reviewIds.includes(item.id) ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-white border-slate-200 text-slate-600'}`}>
                    {reviewIds.includes(item.id) ? '오답노트 담김' : '오답노트 추가'}
                  </button>
                </div>
                <p className="text-xs text-slate-600 mb-1"><span className="font-bold">제시된 뜻 ({item.meanLabel || '뜻'}):</span> "{item.promptMean}"</p>
                {!item.isCorrect && (
                  <p className="text-xs text-rose-600 font-bold">제출한 답안: {item.userAns} ➔ 정답: {item.idiom_kr}</p>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 플래시카드 모듈
    function SwipeModule({ dataset, splitDataset, toggleReview, reviewIds, toggleBookmark, bookmarks }) {
      const [datasetMode, setDatasetMode] = useState('split');
      const [chosungFilter, setChosungFilter] = useState('전체');
      const [mode, setMode] = useState('sequential');
      const [index, setIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const activePool = datasetMode === 'split' ? splitDataset : dataset;
      const baseChosungList = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

      const chosungCounts = useMemo(() => {
        const counts = {};
        activePool.forEach(item => {
          counts[item.chosung] = (counts[item.chosung] || 0) + 1;
        });
        return counts;
      }, [activePool]);

      const filteredDataset = useMemo(() => {
        if (chosungFilter === '전체') return activePool;
        return activePool.filter(item => item.chosung === chosungFilter);
      }, [activePool, chosungFilter]);

      const currentList = useMemo(() => {
        if (mode === 'random') {
          return [...filteredDataset].sort(() => Math.random() - 0.5);
        }
        return filteredDataset;
      }, [filteredDataset, mode]);

      useEffect(() => {
        setIndex(0);
        setIsFlipped(false);
      }, [chosungFilter, mode, datasetMode]);

      const current = currentList[index] || currentList[0];

      const handleNext = () => {
        setIsFlipped(false);
        setIndex((prev) => (prev + 1) % currentList.length);
      };

      const handlePrev = () => {
        setIsFlipped(false);
        setIndex((prev) => (prev - 1 + currentList.length) % currentList.length);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (!isFlipped) {
              setIsFlipped(true);
            } else {
              handleNext();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isFlipped, currentList]);

      if (!current) {
        return (
          <div className="bg-white rounded-2xl p-12 text-center border border-slate-200">
            <p className="text-slate-500 font-bold">해당 초성의 성어가 없습니다.</p>
            <button onClick={() => setChosungFilter('전체')} className="mt-4 px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">전체 보기로 돌아가기</button>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 max-w-lg mx-auto">
          <div className="flex gap-2 mb-4 bg-slate-100 p-1 rounded-xl">
            <button onClick={() => setDatasetMode('normal')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${datasetMode === 'normal' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>
              📌 100개 성어 카드
            </button>
            <button onClick={() => setDatasetMode('split')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${datasetMode === 'split' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>
              🔥 전체 뜻 분리 셔플 ({splitDataset.length}개)
            </button>
          </div>

          <div className="mb-4 flex flex-wrap justify-between items-center gap-2">
            <div className="flex flex-wrap gap-1 mb-2">
              <button onClick={() => setChosungFilter('전체')} className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${chosungFilter === '전체' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                전체 ({activePool.length})
              </button>
              {baseChosungList.map(c => {
                const cnt = chosungCounts[c] || 0;
                if (cnt === 0) return null;
                return (
                  <button key={c} onClick={() => setChosungFilter(c)} className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${chosungFilter === c ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                    {c}({cnt})
                  </button>
                );
              })}
            </div>

            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl w-full justify-end">
              <button onClick={() => setMode('sequential')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${mode === 'sequential' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}>순서대로</button>
              <button onClick={() => setMode('random')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${mode === 'random' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}>랜덤</button>
            </div>
          </div>

          <div className="flex justify-between items-center mb-3 text-xs font-bold text-slate-400">
            <span>카드 ({index + 1} / {currentList.length})</span>
            <span>💡 탭하거나 엔터(Enter)를 누르면 정답/다음으로 넘어갑니다</span>
          </div>

          <div onClick={() => setIsFlipped(!isFlipped)} className="cursor-pointer min-h-[260px] bg-indigo-50/70 border-2 border-indigo-100 rounded-3xl p-6 flex flex-col justify-between items-center shadow-inner transition-transform active:scale-[0.99] text-center">
            <div className="flex justify-between w-full">
              <span className="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-md">
                초성: {current.chosung} {current.meanLabel ? `(${current.meanLabel})` : ''}
              </span>
              <button onClick={(e) => { e.stopPropagation(); toggleBookmark(current.id); }} className="text-xl">
                {bookmarks.includes(current.id) ? '⭐' : '☆'}
              </button>
            </div>

            {!isFlipped ? (
              <div className="my-auto">
                <div className="text-xs text-indigo-500 font-bold mb-2">뜻을 보고 사자성어를 생각해보세요</div>
                {datasetMode === 'split' ? (
                  <div className="text-lg font-black text-slate-800">"{current.promptMean}"</div>
                ) : (
                  <div>
                    <div className="text-base font-bold text-slate-800 mb-1">1. {current.mean1}</div>
                    {current.mean2 && current.mean2 !== '-' && (
                      <div className="text-xs text-slate-500">2. {current.mean2}</div>
                    )}
                  </div>
                )}
              </div>
            ) : (
              <div className="my-auto">
                <div className="text-xs text-indigo-500 font-bold mb-1">정답 한글 성어 및 한자</div>
                <div className="text-3xl font-black text-indigo-600 mb-1">{current.idiom_kr}</div>
                <div className="text-sm font-bold text-slate-700">({current.idiom_cn})</div>
              </div>
            )}

            <div className="text-xs text-slate-400 font-medium">탭 또는 Enter로 {isFlipped ? '다음 카드' : '정답 확인'}</div>
          </div>

          <div className="grid grid-cols-2 gap-3 mt-6">
            <button onClick={handlePrev} className="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">
              ◀ 이전 카드
            </button>
            <button onClick={handleNext} className="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors">
              다음 카드 ▶
            </button>
          </div>

          <div className="mt-4 pt-4 border-t border-slate-100 flex justify-center gap-4">
            <button onClick={() => toggleReview(current.id)} className={`text-xs font-bold px-3 py-2 rounded-xl border transition-colors ${reviewIds.includes(current.id) ? 'bg-rose-100 text-rose-700 border-rose-300' : 'bg-white text-slate-600 border-slate-200'}`}>
              {reviewIds.includes(current.id) ? '❌ 오답노트에서 제거' : '❌ 오답노트에 추가'}
            </button>
          </div>
        </div>
      );
    }

    // 전체 사전 모듈
    function DictModule({ data, toggleReview, reviewIds, toggleBookmark, bookmarks }) {
      const [chosungFilter, setChosungFilter] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');

      const baseChosungList = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

      const chosungCounts = useMemo(() => {
        const counts = {};
        data.forEach(item => {
          counts[item.chosung] = (counts[item.chosung] || 0) + 1;
        });
        return counts;
      }, [data]);

      const filteredData = useMemo(() => {
        return data.filter(item => {
          const matchChosung = chosungFilter === '전체' || item.chosung === chosungFilter;
          const matchSearch = searchQuery.trim() === '' || 
            item.idiom_kr.includes(searchQuery) || 
            item.idiom_cn.includes(searchQuery) || 
            item.mean1.includes(searchQuery) || 
            (item.mean2 && item.mean2.includes(searchQuery));
          return matchChosung && matchSearch;
        });
      }, [data, chosungFilter, searchQuery]);

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <input
            type="text"
            placeholder="성어, 한자, 뜻 검색..."
            value={searchQuery}
            onChange={e => setSearchQuery(e.target.value)}
            className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 mb-4"
          />

          <div className="flex flex-wrap gap-1.5 mb-6">
            <button onClick={() => setChosungFilter('전체')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${chosungFilter === '전체' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
              전체 ({data.length})
            </button>
            {baseChosungList.map(c => {
              const cnt = chosungCounts[c] || 0;
              if (cnt === 0) return null;
              return (
                <button key={c} onClick={() => setChosungFilter(c)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${chosungFilter === c ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                  {c}({cnt})
                </button>
              );
            })}
          </div>

          <div className="text-xs text-slate-400 mb-3">총 {filteredData.length}개 성어</div>

          <div className="space-y-3">
            {filteredData.map(item => (
              <div key={item.id} className="p-4 rounded-xl border border-slate-200 hover:border-indigo-200 transition-colors flex justify-between items-start gap-4">
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-black text-lg text-slate-900">{item.idiom_kr}</span>
                    <span className="text-sm text-indigo-600 font-bold">({item.idiom_cn})</span>
                    <span className="text-[10px] bg-slate-100 text-slate-500 font-bold px-1.5 py-0.5 rounded">{item.chosung}</span>
                  </div>
                  <p className="text-xs text-slate-700 font-medium">1. {item.mean1}</p>
                  {item.mean2 && item.mean2.trim() !== '' && item.mean2 !== '-' && (
                    <p className="text-xs text-slate-500 mt-0.5">2. {item.mean2}</p>
                  )}
                </div>

                <div className="flex gap-2">
                  <button onClick={() => toggleBookmark(item.id)} className="text-lg">
                    {bookmarks.includes(item.id) ? '⭐' : '☆'}
                  </button>
                  <button onClick={() => toggleReview(item.id)} className={`text-xs px-2.5 py-1.5 rounded-lg font-bold border ${reviewIds.includes(item.id) ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                    {reviewIds.includes(item.id) ? '오답' : '+오답'}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 오답노트 모듈
    function ReviewModule({ data, reviewIds, toggleReview }) {
      const reviewList = useMemo(() => data.filter(item => reviewIds.includes(item.id)), [data, reviewIds]);

      if (reviewList.length === 0) {
        return (
          <div className="bg-white rounded-2xl p-12 text-center border border-slate-200">
            <div className="text-4xl mb-3">🎉</div>
            <h3 className="font-bold text-slate-800 mb-1">오답노트가 비어 있습니다</h3>
            <p className="text-xs text-slate-500">모의고사나 전체 열람에서 복습이 필요한 성어를 오답노트에 담아보세요!</p>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <div className="flex justify-between items-center mb-6">
            <h2 className="font-bold text-slate-900">내 오답노트 ({reviewList.length}개)</h2>
          </div>

          <div className="space-y-3">
            {reviewList.map(item => (
              <div key={item.id} className="p-4 rounded-xl border border-rose-100 bg-rose-50/30 flex justify-between items-start gap-4">
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-black text-lg text-slate-900">{item.idiom_kr}</span>
                    <span className="text-sm text-indigo-600 font-bold">({item.idiom_cn})</span>
                  </div>
                  <p className="text-xs text-slate-700 font-medium">1. {item.mean1}</p>
                  {item.mean2 && item.mean2.trim() !== '' && item.mean2 !== '-' && (
                    <p className="text-xs text-slate-500 mt-0.5">2. {item.mean2}</p>
                  )}
                </div>

                <button onClick={() => toggleReview(item.id)} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-white border border-rose-200 text-rose-600 hover:bg-rose-50">
                  삭제
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

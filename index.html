    function App() {

      useEffect(() => { localStorage.setItem('bookmarks', JSON.stringify(bookmarks)); }, [bookmarks]);
      useEffect(() => { localStorage.setItem('app_user', JSON.stringify(user)); }, [user]);

      const toggleReviewItem = (id) => {
        setReviewIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const toggleBookmark = (id) => {
        setBookmarks(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (!loginInput.trim()) return;
        setUser({ name: loginInput.trim(), date: new Date().toLocaleDateString() });
        setShowLoginModal(false);
        setLoginInput('');
      };

      return (
        <div class="max-w-4xl mx-auto px-4 py-6 pb-20">

            <div class="flex items-center gap-3">

              📝 실전 모의고사

              🎴 스와이프 학습

            <button onClick={() => setTab('dict')} class={`py-3 px-2 rounded-xl font-bold text-sm transition-all text-center ${tab === 'dict' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}>

          <main>

    // 모의고사 모듈
    function ExamModule({ data, toggleReview, reviewIds }) {
      const [examStatus, setExamStatus] = useState('config'); // config, testing, result
      const [questionCount, setQuestionCount] = useState(10);
      const [quizList, setQuizList] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState([]);
      const [userAnswer, setUserAnswer] = useState('');
      const [showHintChosung, setShowHintChosung] = useState(false);
      const [showHintHanja, setShowHintHanja] = useState(false);
      const [elapsedTime, setElapsedTime] = useState(0);
      const timerRef = useRef(null);

      const startExam = (count) => {
        const shuffled = [...data].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, count === 100 ? 100 : count).map(item => {
          const hasMean2 = Boolean(item.mean2 && item.mean2.trim() !== '' && item.mean2 !== '-');
          const promptType = hasMean2 ? (Math.random() < 0.5 ? 'mean1' : 'mean2') : 'mean1';
          return {
            ...item,
            promptType,
            promptMean: promptType === 'mean1' ? item.mean1 : item.mean2
          };
        });
        setQuizList(selected);
        setUserAnswers(new Array(selected.length).fill(''));
        setCurrentIndex(0);
        setUserAnswer('');
        setShowHintChosung(false);
        setShowHintHanja(false);
        setElapsedTime(0);
        setExamStatus('testing');

        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => setElapsedTime(prev => prev + 1), 1000);
      };

      const handleNext = (e) => {
        e.preventDefault();
        const updated = [...userAnswers];
        updated[currentIndex] = userAnswer;
        setUserAnswers(updated);
        setUserAnswer('');
        setShowHintChosung(false);
        setShowHintHanja(false);

        if (currentIndex + 1 < quizList.length) {
          setCurrentIndex(currentIndex + 1);
        } else {
          finishExam(updated);
        }
      };

      const finishExam = (finalAnswers = userAnswers) => {
        if (timerRef.current) clearInterval(timerRef.current);
        setUserAnswers(finalAnswers);
        setExamStatus('result');
      };

      const scoreResult = useMemo(() => {
        if (examStatus !== 'result') return { correctCount: 0, percentage: 0, details: [] };
        let correct = 0;
        const details = quizList.map((item, idx) => {
          const ans = (finalAnswers[idx] || '').replace(/\s+/g, '');
          const target = item.idiom_kr.replace(/\s+/g, '');
          const isCorrect = ans === target;
          if (isCorrect) correct++;
          return { ...item, userAns: userAnswers[idx] || '(미응답)', isCorrect };
        });
        return { correctCount: correct, percentage: Math.round((correct / quizList.length) * 100), details };
      }, [examStatus, quizList, userAnswers]);

      const addAllWrongToReview = () => {
        scoreResult.details.forEach(item => {
          if (!item.isCorrect && !reviewIds.includes(item.id)) {
            toggleReview(item.id);
          }
        });
        alert('틀린 문항이 오답노트에 추가되었습니다!');
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins > 0 ? `${mins}분 ` : ''}${secs}초`;
      };

      if (examStatus === 'config') {
        return (
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 mb-2">수행평가 대비 실전 모의고사</h2>
            <p class="text-sm text-slate-500 mb-6">실제 수행평가 시험과 동일하게 뜻 1 또는 뜻 2 중 임의의 뜻 하나를 보고, 정답 한글 사자성어 4글자를 직접 입력하는 방식입니다.</p>

            <label class="block font-bold text-sm text-slate-700 mb-3">응시할 문항 수를 선택하세요</label>
            <div class="grid grid-cols-4 gap-3 mb-8">
              {[10, 20, 50, 100].map(count => (
                <button key={count} onClick={() => setQuestionCount(count)} class={`py-3.5 px-4 rounded-xl border-2 text-sm font-extrabold transition-all ${questionCount === count ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                  {count === 100 ? '전체 100문항' : `${count}문항`}
                </button>
              ))}
            </div>

            <button onClick={() => startExam(questionCount)} class="w-full py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-100 transition-all text-lg flex items-center justify-center gap-2">
              ⚡ 모의고사 시작하기 ({questionCount}문항)
            </button>
          </div>
        );
      }

      if (examStatus === 'testing') {
        const currentQ = quizList[currentIndex];
        return (
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            {/* Top Info */}
            <div class="flex justify-between items-center mb-4 text-xs font-bold text-slate-400">
              <span>문제 {currentIndex + 1} / {quizList.length}</span>
              <span class="text-indigo-600">⏱️ {formatTime(elapsedTime)}</span>
              <button onClick={() => finishExam(userAnswers)} class="text-rose-500 hover:underline">시험 종료</button>
            </div>

            {/* Progress Bar */}
            <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
              <div class="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${((currentIndex + 1) / quizList.length) * 100}%` }}></div>
            </div>

            {/* Question Card */}
            <div class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-6 mb-6 text-center">
              <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md mb-3">
                {currentQ.promptType === 'mean1' ? '뜻 1 제시' : '뜻 2 제시'}
              </span>
              <h3 class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                "{currentQ.promptMean}"
              </h3>
            </div>

            {/* Hints */}
            <div class="flex justify-center gap-3 mb-6">
              <button type="button" onClick={() => setShowHintChosung(!showHintChosung)} class={`text-xs px-3 py-1.5 rounded-lg border font-bold transition-colors ${showHintChosung ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                💡 초성 힌트 {showHintChosung ? `: ${currentQ.chosung}` : ''}
              </button>
              <button type="button" onClick={() => setShowHintHanja(!showHintHanja)} class={`text-xs px-3 py-1.5 rounded-lg border font-bold transition-colors ${showHintHanja ? 'bg-indigo-100 border-indigo-300 text-indigo-800' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                漢 한자 힌트 {showHintHanja ? `: ${currentQ.idiom_cn}` : ''}
              </button>
            </div>

            {/* Form */}
            <form onSubmit={handleNext}>
              <input
                type="text"
                autoFocus
                placeholder="한글 4글자 답안 입력"
                value={userAnswer}
                onChange={e => setUserAnswer(e.target.value)}
                class="w-full text-center text-2xl font-black p-4 rounded-2xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none mb-6 tracking-wider"
              />
              <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">
                {currentIndex + 1 === quizList.length ? '답안 제출 & 시험 완료' : '다음 문제 ➔'}
              </button>
            </form>
          </div>
        );
      }

      // Result Screen
      return (
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <div class="text-center pb-6 border-b border-slate-100 mb-6">
            <h2 class="text-2xl font-black text-slate-900 mb-2">수행평가 모의고사 결과</h2>
            <div class="text-5xl font-black text-indigo-600 mb-3">{scoreResult.percentage}점</div>
            <p class="text-sm font-bold text-slate-600">
              총 {quizList.length}문항 중 <span class="text-emerald-600">{scoreResult.correctCount}개</span> 정답
            </p>
            <p class="text-xs text-slate-400 mt-1">소요 시간: {formatTime(elapsedTime)}</p>

            <div class="flex justify-center gap-3 mt-6">
              <button onClick={() => setExamStatus('config')} class="px-5 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-colors">
                🔄 다시 시험 보기
              </button>
              <button onClick={addAllWrongToReview} class="px-5 py-2.5 bg-rose-50 border border-rose-200 text-rose-600 text-sm font-bold rounded-xl hover:bg-rose-100 transition-colors">
                ❌ 틀린 문제 오답노트에 담기
              </button>
            </div>
          </div>

          <h3 class="font-bold text-slate-900 mb-4">문항별 채점 상세 내역</h3>
          <div class="space-y-3">
            {scoreResult.details.map((item, idx) => (
              <div key={idx} class={`p-4 rounded-xl border ${item.isCorrect ? 'border-emerald-200 bg-emerald-50/40' : 'border-rose-200 bg-rose-50/40'}`}>
                <div class="flex justify-between items-start mb-1">
                  <div class="flex items-center gap-2">
                    <span class={`font-black text-sm ${item.isCorrect ? 'text-emerald-600' : 'text-rose-600'}`}>
                      #{idx + 1} {item.isCorrect ? '⭕ 정답' : '❌ 오답'}
                    </span>
                    <span class="font-bold text-slate-900">{item.idiom_kr}</span>
                    <span class="text-xs text-slate-500">({item.idiom_cn})</span>
                  </div>
                  <button onClick={() => toggleReview(item.id)} class={`text-xs px-2 py-1 rounded border font-bold ${reviewIds.includes(item.id) ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-white border-slate-200 text-slate-600'}`}>
                    {reviewIds.includes(item.id) ? '오답노트 담김' : '오답노트 추가'}
                  </button>
                </div>
                <p class="text-xs text-slate-600 mb-1"><span class="font-bold">제시된 뜻:</span> "{item.promptMean}"</p>
                {!item.isCorrect && (
                  <p class="text-xs text-rose-600 font-bold">제출한 답안: {item.userAns} ➔ 정답: {item.idiom_kr}</p>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 스와이프 모듈
    function SwipeModule({ dataset, toggleReview, reviewIds, toggleBookmark, bookmarks }) {
      const [index, setIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const current = dataset[index];

      const handleNext = () => {
        setIsFlipped(false);
        setIndex((prev) => (prev + 1) % dataset.length);
      };

      const handlePrev = () => {
        setIsFlipped(false);
        setIndex((prev) => (prev - 1 + dataset.length) % dataset.length);
      };

      return (
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 max-w-lg mx-auto text-center">
          <div class="flex justify-between items-center mb-4 text-xs font-bold text-slate-400">
            <span>성어 카드 ({index + 1} / {dataset.length})</span>
            <span>💡 카드를 클릭하면 뒤집힙니다</span>
          </div>

          {/* Flashcard */}
          <div onClick={() => setIsFlipped(!isFlipped)} class="cursor-pointer min-h-[260px] bg-indigo-50/70 border-2 border-indigo-100 rounded-3xl p-6 flex flex-col justify-between items-center shadow-inner transition-transform active:scale-[0.99]">
            <div class="flex justify-between w-full">
              <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-md">{current.chosung}</span>
              <button onClick={(e) => { e.stopPropagation(); toggleBookmark(current.id); }} class="text-xl">
                {bookmarks.includes(current.id) ? '⭐' : '☆'}
              </button>
            </div>

            {!isFlipped ? (
              <div class="my-auto">
                <div class="text-4xl font-black text-slate-900 mb-2">{current.idiom_cn}</div>
                <div class="text-sm font-bold text-indigo-600 mb-1">뜻: {current.mean1}</div>
                {current.mean2 && <div class="text-xs text-slate-500">또는: {current.mean2}</div>}
              </div>
            ) : (
              <div class="my-auto">
                <div class="text-xs text-indigo-500 font-bold mb-1">정답 한글 성어</div>
                <div class="text-4xl font-black text-indigo-600 mb-2">{current.idiom_kr}</div>
                <div class="text-sm font-bold text-slate-700">{current.idiom_cn}</div>
              </div>
            )}

            <div class="text-xs text-slate-400 font-medium">탭하여 {isFlipped ? '앞면 보기' : '한글 성어 확인'}</div>
          </div>

          {/* Controls */}
          <div class="grid grid-cols-2 gap-3 mt-6">
            <button onClick={handlePrev} class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">
              ◀ 이전 성어
            </button>
            <button onClick={handleNext} class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors">
              다음 성어 ▶
            </button>
          </div>

          <div class="mt-4 pt-4 border-t border-slate-100 flex justify-center gap-4">
            <button onClick={() => toggleReview(current.id)} class={`text-xs font-bold px-3 py-2 rounded-xl border transition-colors ${reviewIds.includes(current.id) ? 'bg-rose-100 text-rose-700 border-rose-300' : 'bg-white text-slate-600 border-slate-200'}`}>
              {reviewIds.includes(current.id) ? '❌ 오답노트에서 제거' : '❌ 오답노트에 추가'}
            </button>
          </div>
        </div>
      );
    }

    // 사전 모듈
    function DictModule({ data, toggleReview, reviewIds, toggleBookmark, bookmarks }) {
      const [chosungFilter, setChosungFilter] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');

      const chosungList = ['전체', 'ㄱ', 'ㄴ', 'ㄷ', 'ㅁ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅌ', 'ㅍ', 'ㅎ'];

      const filteredData = useMemo(() => {
        return data.filter(item => {
          const matchChosung = chosungFilter === '전체' || item.chosung === chosungFilter;
          const matchSearch = searchQuery.trim() === '' || 
            item.idiom_kr.includes(searchQuery) || 
            item.idiom_cn.includes(searchQuery) || 
            item.mean1.includes(searchQuery) || 
            (item.mean2 && item.mean2.includes(searchQuery));
          return matchChosung && matchSearch;
        });
      }, [data, chosungFilter, searchQuery]);

      return (
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          {/* Search Bar */}
          <input
            type="text"
            placeholder="성어, 한자, 뜻 검색..."
            value={searchQuery}
            onChange={e => setSearchQuery(e.target.value)}
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 mb-4"
          />

          {/* Chosung Filter Buttons */}
          <div class="flex flex-wrap gap-1.5 mb-6">
            {chosungList.map(c => (
              <button key={c} onClick={() => setChosungFilter(c)} class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${chosungFilter === c ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                {c}
              </button>
            ))}
          </div>

          <div class="text-xs text-slate-400 mb-3">총 {filteredData.length}개 성어</div>

          {/* List Table */}
          <div class="space-y-3">
            {filteredData.map(item => (
              <div key={item.id} class="p-4 rounded-xl border border-slate-200 hover:border-indigo-200 transition-colors flex justify-between items-start gap-4">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="font-black text-lg text-slate-900">{item.idiom_kr}</span>
                    <span class="text-sm text-indigo-600 font-bold">({item.idiom_cn})</span>
                    <span class="text-[10px] bg-slate-100 text-slate-500 font-bold px-1.5 py-0.5 rounded">{item.chosung}</span>
                  </div>
                  <p class="text-xs text-slate-700 font-medium">1. {item.mean1}</p>
                  {item.mean2 && item.mean2.trim() !== '' && item.mean2 !== '-' && (
                    <p class="text-xs text-slate-500 mt-0.5">2. {item.mean2}</p>
                  )}
                </div>

                <div class="flex gap-2">
                  <button onClick={() => toggleBookmark(item.id)} class="text-lg">
                    {bookmarks.includes(item.id) ? '⭐' : '☆'}
                  </button>
                  <button onClick={() => toggleReview(item.id)} class={`text-xs px-2.5 py-1.5 rounded-lg font-bold border ${reviewIds.includes(item.id) ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                    {reviewIds.includes(item.id) ? '오답' : '+오답'}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 오답노트 모듈
    function ReviewModule({ data, reviewIds, toggleReview, toggleBookmark, bookmarks }) {
      const reviewList = useMemo(() => data.filter(item => reviewIds.includes(item.id)), [data, reviewIds]);

      if (reviewList.length === 0) {
        return (
          <div class="bg-white rounded-2xl p-12 text-center border border-slate-200">
            <div class="text-4xl mb-3">🎉</div>
            <h3 class="font-bold text-slate-800 mb-1">오답노트가 비어 있습니다</h3>
            <p class="text-xs text-slate-500">모의고사나 전체 열람에서 복습이 필요한 성어를 오답노트에 담아보세요!</p>
          </div>
        );
      }

      return (
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-6">
            <h2 class="font-bold text-slate-900">내 오답노트 ({reviewList.length}개)</h2>
          </div>

          <div class="space-y-3">
            {reviewList.map(item => (
              <div key={item.id} class="p-4 rounded-xl border border-rose-100 bg-rose-50/30 flex justify-between items-start gap-4">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="font-black text-lg text-slate-900">{item.idiom_kr}</span>
                    <span class="text-sm text-indigo-600 font-bold">({item.idiom_cn})</span>
                  </div>
                  <p class="text-xs text-slate-700 font-medium">1. {item.mean1}</p>
                  {item.mean2 && item.mean2.trim() !== '' && item.mean2 !== '-' && (
                    <p class="text-xs text-slate-500 mt-0.5">2. {item.mean2}</p>
                  )}
                </div>

                <button onClick={() => toggleReview(item.id)} class="text-xs font-bold px-3 py-1.5 rounded-lg bg-white border border-rose-200 text-rose-600 hover:bg-rose-50">
                  삭제
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
